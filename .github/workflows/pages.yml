name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify site contents
        run: |
          echo "docs/ contents:"
          ls -la docs/
          echo
          echo "Verifying key files exist:"
          for f in docs/index.html docs/.nojekyll docs/data/dashboard-summary.json docs/data/weekly/manifest.json docs/reports/weekly/2026-W27.md; do
            if [ -f "$f" ]; then
              echo "  OK $f ($(stat -c%s "$f") B)"
            else
              echo "  MISSING $f"
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4