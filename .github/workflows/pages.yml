name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Run tests
        env:
          AI_EDUCATION_OPENALEX_BACKOFF: "0"
          AI_EDUCATION_OPENALEX_PACING: "0"
          AI_EDUCATION_ARXIV_API_DELAY: "0"
        run: python3 -m unittest discover -s tests

      - name: Verify site contents
        run: |
          latest="docs/$(python3 -c "import json;print(json.load(open('docs/data/weekly/manifest.json'))['weekly_report'])")"
          for f in docs/index.html docs/.nojekyll docs/data/dashboard-summary.json docs/data/weekly/manifest.json "$latest"; do
            if [ -f "$f" ]; then
              echo "  OK $f ($(stat -c%s "$f") B)"
            else
              echo "  MISSING $f"
              exit 1
            fi
          done
          python3 -c "import json,glob;[json.load(open(f,encoding='utf-8')) for f in glob.glob('docs/data/**/*.json',recursive=True)];print('  OK all data JSON parses')"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4